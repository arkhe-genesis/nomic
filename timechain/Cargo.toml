[package]
name = "timechain"
version = "0.1.0"
edition = "2021"

[dependencies]
ndarray = { version = "0.15", features = ["serde"] }
ndarray-linalg = { version = "0.16", features = ["openblas-system"] }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
rand = "0.8"
tokio = { version = "1.4", features = ["full"] }
rayon = "1.7"
num-traits = "0.2"
num-complex = "0.4"
sha2 = "0.10"
chrono = "0.4"
openblas-build = { version = "=0.10.5" }
aes-gcm = "0.11.0"
pqcrypto-kyber = "0.8"
pqcrypto-dilithium = "0.5.0"
sha3 = "0.12.0"
pqcrypto-traits = "0.3.5"
thiserror = "2.0.19"

[[bin]]
name = "simulator_pqc"
path = "src/bin/simulator_pqc.rs"
